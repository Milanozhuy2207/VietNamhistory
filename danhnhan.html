<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh Nhân - Hào Khí Sử Việt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/danhnhan.css" />
    <script>
      if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light-theme');
      }
    </script>
  </head>
  <body>


    <div style="padding-top: 100px; min-height: 80vh">
      <section class="roster-section reveal">
        <h2 class="section-title">Từ Điển Danh Nhân</h2>

        <div class="filter-bar glass-box">
          <div class="filter-group">
            <span class="filter-label">LỌC THEO:</span>
            <select id="role-filter" onchange="filterFigures()">
              <option value="all">Tất cả</option>
              <option value="vua">Hoàng Đế / Lãnh Tụ</option>
              <option value="tuong">Danh Tướng</option>
              <option value="van">Danh Nhân Văn Hóa</option>
            </select>
          </div>
          <div class="filter-group">
            <input
              type="text"
              id="search-box"
              placeholder="Tìm kiếm..."
              onkeyup="filterFigures()"
            />
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
          </div>
        </div>

        <div id="roster-grid" class="roster-grid glow-effect"></div>
      </section>

      <section class="gallery-section reveal">
        <h2 class="section-title">Cổ Vật & Di Sản</h2>
        <div class="carousel-container glow-effect">
          <div class="slide active">
            <img
              src="assets/images/trongdong.jpg"
            />
            <div class="caption glass-box">Trống đồng Đông Sơn</div>
          </div>
          <div class="slide">
            <img
              src="assets/images/gomsucotruyen.jpg"
            />
            <div class="caption glass-box">Gốm sứ cổ truyền</div>
          </div>
        </div>
      </section>
    </div>

    <div id="info-modal" class="modal-overlay hidden">
      <div class="modal-content profile-container">
        <span class="close-modal" onclick="closeModal()">&times;</span>

        <div class="profile-layout">
          <div class="profile-left">
            <img id="modal-img" src="" alt="Avatar" />
            <h2 id="modal-name">Tên nhân vật</h2>
            <div id="modal-role" class="role-badge"></div>
          </div>

          <div class="profile-right">
            <div class="quote-box">
              <i class="fa-solid fa-quote-left"></i>
              <span id="modal-quote" style="font-style: italic"
                >Câu nói nổi tiếng...</span
              >
              <i class="fa-solid fa-quote-right"></i>
            </div>
            <div id="modal-desc" class="modal-text detail-text"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/components.js"></script>
    <script src="js/global.js"></script>
    <script src="js/danhnhan.js"></script>
  </body>
</html>
